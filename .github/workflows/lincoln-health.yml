name: Lincoln Square heartbeat watchdog
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lincoln-square-state
  cancel-in-progress: false
jobs:
  health:
    if: ${{ false }} # Retired AMC path; Atom replacement is separately gated.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: watcher-state
          path: watcher-state
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: scraper
      - name: Check last successful full scan
        working-directory: scraper
        env:
          WATCHER_RECIPIENTS: ${{ secrets.WATCHER_RECIPIENTS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WATCHER_GIT_STATE: 'true'
        run: npx tsx personalWatch.ts --watchdog
