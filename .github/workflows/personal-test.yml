name: Personal watcher tests
on:
  push:
    branches: [main, lincoln-square-personal]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci
        working-directory: scraper
      - run: npm test
      - run: npm run typecheck
      - run: npm run typecheck
        working-directory: scraper
      - run: npx playwright install --with-deps chromium
        working-directory: scraper
      - run: npx tsx personalSmoke.ts
        working-directory: scraper
