name: Read-only showtime source validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 diagnostics/source-probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: source-probe-results
          path: source-probe-results.json
          retention-days: 7
